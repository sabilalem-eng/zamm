<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran — Nebula Theme</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0c29, #1a1a40, #2d1b69);
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        /* Nebula Background */
        .nebula {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        .cloud {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            animation: float 8s infinite ease-in-out alternate;
        }

        .c1 {
            width: 400px; height: 400px;
            background: #7b2ffd;
            top: -100px; left: -100px;
        }
        .c2 {
            width: 500px; height: 500px;
            background: #ff2ecc;
            bottom: -150px; right: -100px;
            animation-delay: -3s;
        }
        .c3 {
            width: 300px; height: 300px;
            background: #2e9ffd;
            top: 40%; left: 30%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -30px) scale(1.15); }
        }

        /* Payment Card */
        .payment-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 36px 28px;
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px rgba(123, 47, 253, 0.2);
            animation: cardAppear 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
        }

        @keyframes cardAppear {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 12px;
            background: linear-gradient(135deg, #7b2ffd, #ff2ecc, #2e9ffd);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: white;
            animation: logoPulse 3s infinite alternate;
        }

        @keyframes logoPulse {
            0% { box-shadow: 0 0 15px rgba(123, 47, 253, 0.4); }
            100% { box-shadow: 0 0 30px rgba(255, 46, 204, 0.6); }
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }

        .sub {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .amount-box {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .amount-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            margin-bottom: 4px;
        }

        .amount {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
        }

        .section-title {
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qr-box {
            background: #fff;
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            margin-bottom: 24px;
        }

        .qr-placeholder {
            width: 200px;
            height: 200px;
            margin: 0 auto;
            background: repeating-linear-gradient(45deg, #f0f0f0, #f0f0f0 5px, #fff 5px, #fff 10px);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-weight: 600;
        }

        .dana-box {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dana-logo {
            display: inline-block;
            background: #0088ff;
            color: white;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .dana-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            margin-bottom: 4px;
        }

        .dana-number {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .dana-name {
            color: rgba(255, 255, 255, 0.75);
            font-size: 14px;
        }

        .copy-btn {
            background: rgba(123, 47, 253, 0.3);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .copy-btn:hover {
            background: rgba(123, 47, 253, 0.5);
        }

        .note {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            line-height: 1.6;
            text-align: center;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <!-- Nebula Background -->
    <div class="nebula">
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <div class="cloud c3"></div>
    </div>

    <!-- Payment Card -->
    <div class="payment-card">
        <div class="header">
            <div class="logo">✦</div>
            <h1>Konfirmasi Pembayaran</h1>
            <p class="sub">Selesaikan pembayaran Anda</p>
        </div>

        <div class="amount-box">
            <p class="amount-label">Total Pembayaran</p>
            <p class="amount">Rp <span id="total">150.000</span></p>
        </div>

        <p class="section-title">📷 Scan QR Code</p>
        <div class="qr-box">
            <!-- Ganti bagian di bawah dengan gambar QR Code aslimu -->
            <div class="qr-placeholder">
                QR Code<br>di sini
            </div>
        </div>

        <div class="divider"></div>

        <p class="section-title">💳 Atau Transfer DANA</p>
        <div class="dana-box">
            <span class="dana-logo">DANA</span>
            <p class="dana-label">Nomor DANA</p>
            <p class="dana-number" id="dana-num">0812-3456-7890</p>
            <p class="dana-label">Atas Nama</p>
            <p class="dana-name" id="dana-name">[Nama Penerima]</p>
            <button class="copy-btn" onclick="copyNumber()">📋 Salin Nomor</button>
        </div>

        <p class="note">
            ✅ Setelah dikirim, mohon konfirmasi ke kami<br>
            🌌 Nebula Theme — Pembayaran Aman & Terpercaya
        </p>
    </div>

    <script>
        // Generate bintang berkedip
        const nebula = document.querySelector('.nebula');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 2.5 + 0.8;
            star.style.width = star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            nebula.appendChild(star);
        }

        // Salin nomor DANA
        function copyNumber() {
            const num = document.getElementById('dana-num').textContent.replace(/-/g, '');
            navigator.clipboard.writeText(num).then(() => {
                alert('Nomor DANA disalin! ✅');
            });
        }
    </script>
</body>
</html>
