<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Arcade System: All-in-One Game</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #07090e; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; overflow-x: hidden; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        h1 { color: #00d2ff; text-shadow: 0 0 15px rgba(0,210,255,0.6); margin-bottom: 5px; font-size: 28px; }
        .subtitle { color: #8a99ad; margin-bottom: 25px; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; }
        
        /* Menu Utama */
        .card { background: #111622; border: 2px solid #1f293d; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .menu-btn { background: #1f293d; color: #fff; border: 2px solid #3b4e6d; padding: 12px; width: 100%; margin: 8px 0; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; text-align: left; display: flex; align-items: center; justify-content: space-between; }
        .menu-btn:hover { background: #00d2ff; color: #07090e; border-color: #00d2ff; transform: translateY(-2px); }
        .menu-btn span { font-size: 12px; opacity: 0.7; }

        /* Sistem Dialog */
        #dialogBox { background: #111622; border: 3px solid #00d2ff; padding: 20px; border-radius: 12px; margin-top: 40px; text-align: left; display: none; box-shadow: 0 0 20px rgba(0,210,255,0.3); }
        #speakerName { font-weight: bold; color: #00d2ff; font-size: 20px; margin-bottom: 8px; text-transform: uppercase; }
        #dialogText { font-size: 16px; line-height: 1.5; min-height: 50px; color: #e1e7f0; }
        .btn-container { text-align: right; margin-top: 15px; }
        .action-btn { background: #00d2ff; color: #07090e; border: none; padding: 10px 20px; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 6px; transition: 0.2s; }
        .action-btn:hover { background: #00a8cc; transform: scale(1.05); }

        /* Layar Game */
        #gameScreen { display: none; margin-top: 20px; }
        canvas { background: #161a22; display: block; margin: 15px auto; border: 4px solid #1f293d; max-width: 100%; border-radius: 8px; box-shadow: 0 0 25px rgba(0,0,0,0.5); }
        .hud { display: flex; justify-content: space-between; background: #111622; padding: 12px 20px; border-radius: 8px; border: 1px solid #1f293d; font-size: 18px; font-weight: bold; font-family: monospace; margin-bottom: 10px; }
        .controls-hint { font-size: 13px; color: #8a99ad; margin-top: 10px; line-height: 1.4; }
        
        /* Tombol Kembali */
        .back-btn { background: #ff3838; color: white; border: none; padding: 8px 15px; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-bottom: 15px; display: inline-block; }
        .back-btn:hover { background: #cc2424; }
    </style>
</head>
<body>

<div class="container">
    <div id="mainMenu">
        <h1>MEGA ARCADE SYSTEM 🎮</h1>
        <div class="subtitle">Semua Game, Semua Aksi, Semua Latar</div>
        
        <div class="card">
            <h3 style="margin-top:0; text-align:left; color:#00d2ff;">PILIH COMBINASI GAME ANDA:</h3>
            <button class="menu-btn" onclick="selectGame('catch', 'space')">🚀 1. MENANGKAP + LUAR ANGKASA <span>Space Defender</span></button>
            <button class="menu-btn" onclick="selectGame('dodge', 'castle')">🏰 2. MENGHINDAR + KERAJAAN FANTASI <span>Castle Dodge</span></button>
            <button class="menu-btn" onclick="selectGame('click', 'city')">🏙️ 3. MENGETUK + PERKOTAAN MODERN <span>City Clicker</span></button>
        </div>
        <p style="color: #53647c; font-size: 12px;">Pilih salah satu mode di atas untuk langsung memuat seluruh aset mekanik (Action), cerita dialog, dan tema latar belakang (Setting).</p>
    </div>

    <!-- Sistem Dialog Interaktif -->
    <div id="dialogBox">
        <div id="speakerName">-</div>
        <div id="dialogText">-</div>
        <div class="btn-container">
            <button id="nextBtn" class="action-btn" onclick="nextDialog()">Lanjut</button>
        </div>
    </div>

    <!-- Layar Utama Arena Gameplay -->
    <div id="gameScreen">
        <button class="back-btn" onclick="returnToMenu()">← KELUAR KE MENU</button>
        <div class="hud">
            <div>SKOR: <span id="scoreText" style="color:#00d2ff;">0</span></div>
            <div><span id="liveLabel">NYAWA</span>: <span id="livesText" style="color:#ff3838;">3</span></div>
        </div>
        <canvas id="gameCanvas" width="400" height="500"></canvas>
        <div id="controlsHint" class="controls-hint"></div>
    </div>
</div>

<script>
    // Konfigurasi Database Konten (Semua Action & Semua Setting)
    const gameDatabase = {
        'catch_space': {
            title: "SPACE DEFENDER 🚀",
            canvasBg: "#121620",
            playerColor: "#00d2ff",
            itemColor: "#ff3838",
            liveLabel: "PERISAI",
            hint: "Gunakan Tombol Panah Kiri/Kanan atau Sentuh Sisi Layar HP untuk menggeser Tameng Energi dan menangkap Meteor Merah!",
            dialogs: [
                { speaker: "KAI (AI Kapal)", text: "Kapten! Terdeteksi badai meteor raksasa mendekati stasiun luar angkasa kita!" },
                { speaker: "Komandan Alfa", text: "Aktifkan tameng energi biru! Kita harus menampung dan menghancurkan meteor itu sebelum menembus markas utama." },
                { speaker: "KAI (AI Kapal)", text: "Siap. Energi tameng hanya kuat menahan 3 kebocoran hantaman. Semoga berhasil!" }
            ]
        },
        'dodge_castle': {
            title: "CASTLE DODGE 🏰",
            canvasBg: "#1c1510",
            playerColor: "#ffaa00",
            itemColor: "#9900ff",
            liveLabel: "DARAH",
            hint: "Gunakan Tombol Panah Kiri/Kanan atau Sentuh Sisi Layar HP untuk menghindar dari Sihir Ungu jahat yang jatuh dari langit!",
            dialogs: [
                { speaker: "Penyihir Istana", text: "Gawat Yang Mulia! Kastil kita diserang hujan bola api sihir kutukan dari langit!" },
                { speaker: "Raja Agung", text: "Aku harus bergerak cepat menghindarinya! Jangan sampai tubuhku terkena percikan energi kegelapan itu." },
                { speaker: "Penyihir Istana", text: "Benar Raja! Bertahanlah, jika terkena 3 kali sihir itu, pelindung fisik Anda akan lenyap!" }
            ]
        },
        'click_city': {
            title: "CITY CLICKER 🏙️",
            canvasBg: "#1a1a1a",
            playerColor: "transparent", 
            itemColor: "#00ff66",
            liveLabel: "WAKTU",
            hint: "Klik / Ketuk langsung pada Kotak Energi Hijau yang muncul acak di layar secepat mungkin sebelum waktu habis!",
            dialogs: [
                { speaker: "Walikota", text: "Kota kita mati lampu total karena badai ekstrem! Generator cadangan menyebarkan inti daya hijau di udara." },
                { speaker: "Teknisi Kota", text: "Saya butuh bantuanmu untuk langsung MENGETUK/MENGEKLIK inti daya hijau itu secepat mungkin untuk menyalakan listrik!" },
                { speaker: "Walikota", text: "Waktu kita sangat terbatas, sisa energi kota terus berkurang dengan cepat. Ayo selamatkan warga!" }
            ]
        }
    };

    // State Mesin Game global
    let currentAction = '';
    let currentSetting = '';
    let currentConfig = null;
    let currentDialogIndex = 0;
    
    // Variabel Engine Game
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    let player = { x: 160, y: 450, width: 80, height: 15, speed: 8 };
    let item = { x: 200, y: 0, size: 22, speed: 4 };
    let score = 0;
    let lives = 3;
    let gameOver = false;
    let keys = {};
    let loopId = null;

    // Deteksi Kontrol Input
    document.addEventListener("keydown", (e) => keys[e.key] = true);
    document.addEventListener("keyup", (e) => keys[e.key] = false);
    window.addEventListener("touchstart", (e) => {
        let touchX = e.touches[0].clientX;
        if (touchX < window.innerWidth / 2) keys["ArrowLeft"] = true;
        else keys["ArrowRight"] = true;
    });
    window.addEventListener("touchend", () => {
        keys["ArrowLeft"] = false;
        keys["ArrowRight"] = false;
    });
    
    // Khusus Clicker Game: Deteksi Klik pada Canvas
    canvas.addEventListener("mousedown", handleCanvasClick);
    canvas.addEventListener("touchstart", function(e) {
        e.preventDefault();
        let rect = canvas.getBoundingClientRect();
        let touchX = e.touches[0].clientX - rect.left;
        let touchY = e.touches[0].clientY - rect.top;
        // Skala koordinat canvas asli
        let canvasX = touchX * (canvas.width / rect.width);
        let canvasY = touchY * (canvas.height / rect.height);
        checkClickHit(canvasX, canvasY);
    });

    function handleCanvasClick(e) {
        let rect = canvas.getBoundingClientRect();
        let clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
        let clickY = (e.clientY - rect.top) * (canvas.height / rect.height);
        checkClickHit(clickX, clickY);
    }

    function checkClickHit(x, y) {
        if (currentAction !== 'click' || gameOver) return;
        if (x >= item.x && x <= item.x + item.size && y >= item.y && y <= item.y + item.size) {
            score += 10;
            // Pindahkan acak instan setelah diklik
            item.x = Math.random() * (canvas.width - item.size);
            item.y = 40 + Math.random() * (canvas.height - 120);
        }
    }

    // Navigasi Sistem & Pemilihan Game
    function selectGame(action, setting) {
        currentAction = action;
        currentSetting = setting;
        currentConfig = gameDatabase[`${action}_${setting}`];
        currentDialogIndex = 0;

        document.getElementById("mainMenu").style.display = "none";
        document.getElementById("dialogBox").style.display = "block";
        document.getElementById("gameTitle").innerText = currentConfig.title;
        
        showDialog();
    }

    function showDialog() {
        const dBox = currentConfig.dialogs[currentDialogIndex];
        document.getElementById("speakerName").innerText = dBox.speaker;
        document.getElementById("dialogText").innerText = dBox.text;
        
        const nextBtn = document.getElementById("nextBtn");
        if (currentDialogIndex === currentConfig.dialogs.length - 1) {
            nextBtn.innerText = "MULAI GAME ⚡";
            nextBtn.style.background = "#ff3838";
            nextBtn.style.color = "#fff";
        } else {
            nextBtn.innerText = "Lanjut";
            nextBtn.style.background = "#00d2ff";
            nextBtn.style.color = "#07090e";
        }
    }

    function nextDialog() {
        currentDialogIndex++;
        if (currentDialogIndex < currentConfig.dialogs.length) {
            showDialog();
        } else {
            document.getElementById("dialogBox").style.display = "none";
            initGameplay();
        }
    }

    // Inisialisasi Arena Game Baru
    function initGameplay() {
        // Reset state data
        score = 0;
        gameOver = false;
        keys = {};
        canvas.style.background = currentConfig.canvasBg;
        document.getElementById("liveLabel").innerText = currentConfig.liveLabel.toUpperCase();
        document.getElementById("controlsHint").innerText = currentConfig.hint;
        
        if (currentAction === 'click') {
            lives = 15; // Untuk clicker, nyawa dihitung sebagai hitungan mundur Detik Waktu
            item.x = Math.random() * (canvas.width - item.size);
            item.y = 100 + Math.random() * 250;
            // Interval waktu pengurang detik
            if(window.timerInterval) clearInterval(window.timerInterval);
            window.timerInterval = setInterval(() => {
                if (!gameOver) {
                    lives--;
                    if (lives <= 0) {
                        gameOver = true;
                        alert("WAKTU HABIS! Kota gagal diselamatkan. Total poin energi dikumpulkan: " + score);
                        returnToMenu();
                    }
                }
            }, 1000);
        } else {
            lives = 3; // Game catch / dodge pakai nyawa standar
            player.x = 160;
            item.x = Math.random() * (canvas.width - item.size);
            item.y = 0;
            item.speed = 4;
        }

        document.getElementById("gameScreen").style.display = "block";
        
        // Jalankan loop canvas engine
        if (loopId) cancelAnimationFrame(loopId);
        gameLoop();
    }

    // Loop Engine Gambar & Update
    function update() {
        if (gameOver) return;

        // Kontrol Gerak Karakter Balok (Hanya untuk mode Catch & Dodge)
        if (currentAction !== 'click') {
            if (keys["ArrowLeft"] && player.x > 0) player.x -= player.speed;
            if (keys["ArrowRight"] && player.x < canvas.width - player.width) player.x += player.speed;

            item.y += item.speed;

            // Logika Batas Layar Bawah
            if (item.y > canvas.height) {
                if (currentAction === 'catch') {
                    lives--; // Lolos = nyawa kurang di game catching
                }
                resetItem();
            }

            // Deteksi Tabrakan Fisik Karakter dengan Objek
            if (item.y + item.size >= player.y && item.x + item.size >= player.x && item.x <= player.x + player.width) {
                if (currentAction === 'catch') {
                    score += 10;
                    item.speed += 0.35; // Makin cepat
                } else if (currentAction === 'dodge') {
                    lives--; // Terkena rintangan = nyawa berkurang di game dodging
                }
                resetItem();
            }
        } else {
            // Mode Clicker: Objek bergetar pelan atau berpindah berkala jika diabaikan
            item.y += Math.sin(Date.now() / 100) * 0.5;
        }

        // Cek Kondisi Kalah / Selesai
        if (lives <= 0 && !gameOver) {
            gameOver = true;
            alert("GAME OVER! Perjuanganmu terhenti di sini. Skor akhir: " + score);
            returnToMenu();
        }

        document.getElementById("scoreText").innerText = score;
        document.getElementById("livesText").innerText = lives;
    }

    function resetItem() {
        item.x = Math.random() * (canvas.width - item.size);
        item.y = 0;
        if (currentAction === 'dodge') {
            score += 5; // Bertahan dari rintangan membuahkan skor
            item.speed += 0.25;
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (currentAction !== 'click') {
            // Gambar Player/Tameng Pelindung bawah
            ctx.fillStyle = currentConfig.playerColor;
            ctx.shadowBlur = 12;
            ctx.shadowColor = currentConfig.playerColor;
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }

        // Gambar Objek Target/Meteor/Sihir
        ctx.fillStyle = currentConfig.itemColor;
        ctx.shadowBlur = 12;
        ctx.shadowColor = currentConfig.itemColor;
        
        // Render bentuk
        ctx.fillRect(item.x, item.y, item.size, item.size);
        ctx.shadowBlur = 0; // Matikan shadow agar performa lancar
    }

    function gameLoop() {
        update();
        draw();
        if (!gameOver) {
            loopId = requestAnimationFrame(gameLoop);
        }
    }

    function returnToMenu() {
        gameOver = true;
        if(window.timerInterval) clearInterval(window.timerInterval);
        if (loopId) cancelAnimationFrame(loopId);
        
        document.getElementById("gameScreen").style.display = "none";
        document.getElementById("dialogBox").style.display = "none";
        document.getElementById("mainMenu").style.display = "block";
        document.getElementById("gameTitle").innerHTML = "MEGA ARCADE SYSTEM 🎮";
    }
</script>

</body>
</html>
