<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZEUS189 - Situs Terpopuler 2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      /* Pola titik-titik transparan biru gelap berulang untuk tekstur */
      background-image: radial-gradient(circle, rgba(0, 90, 255, 0.35) 1px, transparent 1px);
      background-size: 18px 18px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    #app-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
      background-color: rgba(0, 0, 0, 0.4);
      border-left: 1px solid rgba(0, 180, 255, 0.15);
      border-right: 1px solid rgba(0, 180, 255, 0.15);
      min-height: 100vh;
    }

    /* ---------- HEADER / LOGO ---------- */
    header {
      text-align: center;
      padding: 24px 8px 12px;
    }

    .logo {
      font-family: 'Impact', 'Arial Black', sans-serif;
      font-size: 3.2rem;
      letter-spacing: 3px;
      line-height: 1;
      /* Gradasi biru terang -> biru tua + efek 3D shadow */
      background: linear-gradient(to bottom, #00E5FF, #0047FF);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow:
        0 1px 0 #003366,
        0 2px 0 #002a55,
        0 3px 0 #001f40,
        0 5px 8px rgba(0, 0, 0, 0.9),
        0 0 20px rgba(0, 180, 255, 0.5);
    }

    .subtitle {
      margin-top: 10px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.9rem;
      letter-spacing: 2px;
      color: #cfe9ff;
      text-transform: uppercase;
    }

    /* ---------- HERO IMAGE ---------- */
    .hero-section {
      margin: 18px 0;
      border: 2px solid rgba(0, 180, 255, 0.35);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 18px rgba(0, 150, 255, 0.25);
    }

    .hero-section img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: cover;
    }

    /* ---------- CTA BUTTONS ---------- */
    .cta-section {
      margin: 8px 0 24px;
    }

    .btn {
      display: block;
      width: 100%;
      margin-bottom: 15px;
      padding: 15px;
      border-radius: 10px;
      background-color: #00c3ff; /* Biru neon terang mencolok */
      color: #000000;
      text-align: center;
      font-family: 'Arial', sans-serif;
      font-weight: bold;
      font-size: 1.2rem;
      letter-spacing: 1px;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 195, 255, 0.45);
      transition: filter 0.2s ease, transform 0.1s ease;
    }

    .btn:hover {
      filter: brightness(0.9);
    }

    .btn:active {
      filter: brightness(0.85);
      transform: scale(0.98);
    }

    /* ---------- FOOTER ---------- */
    footer {
      text-align: center;
      padding: 20px 8px 30px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      color: #aecbe0;
    }

    footer a {
      color: #00c3ff;
      text-decoration: none;
      font-weight: bold;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="app-container">

    <header>
      <h1 class="logo">ZEUS189</h1>
      <p class="subtitle">ZEUS189 SITUS TERPOPULER 2026</p>
    </header>

    <main>
      <!-- Hero Image Section -->
      <section class="hero-section">
        <img src="https://files.catbox.moe/65zt1n.jpg" alt="Banner Utama ZEUS189">
      </section>

      <!-- Call To Action Section -->
      <section class="cta-section">
        <a href="#" class="btn" id="btn-login">LOGIN ZEUS189</a>
        <a href="https://zeus189.my.id" class="btn" id="btn-daftar" target="_blank" rel="noopener">DAFTAR ZEUS189</a>
      </section>
    </main>

    <footer>
      &copy; Copyright 2026 <a href="https://zeus189.my.id" target="_blank" rel="noopener">ZEUS189</a> | KKS SEO
    </footer>

  </div>

  <script>
    // Tombol Login & Daftar: arahkan ke URL tujuan
    const btnLogin = document.getElementById('btn-login');
    const btnDaftar = document.getElementById('btn-daftar');

    btnLogin.addEventListener('click', function (e) {
      e.preventDefault();
      window.location.href = 'https://zeus189.my.id'; // ganti jika URL login berbeda
    });

    btnDaftar.addEventListener('click', function (e) {
      // Sudah ada href, biarkan terbuka di tab baru sesuai atribut target
      window.open('https://zeus189.my.id', '_blank');
    });
  </script>
</body>
</html>
